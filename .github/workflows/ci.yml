name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Runner provenance preflight
        env:
          AO_RUNNER_LABELS: ${{ runner.os }},${{ runner.arch }}
          AO_RUNNER_IMAGE_DIGEST: ${{ vars.AO_RUNNER_IMAGE_DIGEST }}
          AO_APPROVED_RUNNER_DIGESTS: ${{ vars.AO_APPROVED_RUNNER_DIGESTS }}
          AO_RUNNER_IMAGE_BUILT_AT: ${{ vars.AO_RUNNER_IMAGE_BUILT_AT }}
          AO_APPROVED_RUNNER_LABELS: ${{ vars.AO_APPROVED_RUNNER_LABELS }}
          AO_STRICT_RUNNER_PREFLIGHT: ${{ vars.AO_STRICT_RUNNER_PREFLIGHT }}
        run: python tools/validate_runner_provenance.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/
